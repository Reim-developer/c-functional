name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang if missing
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi
      - name: Full matrix (gcc + clang, C99 + C11)
        run: make check-strict

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASan + UBSan (gcc, C99)
        run: make asan

  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CMake)
        run: cmake -S . -B build -DCF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test (CTest)
        run: ctest --test-dir build -C Release --output-on-failure
